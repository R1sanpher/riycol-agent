[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riycol-agent"
version = "2.2.0"
description = "Multi-agent AI service framework with local LLM, Telegram bot, and knowledge base"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Riycol Team"}]

dependencies = [
    "openai>=1.0",
    "requests>=2.28",
    "chromadb>=0.4",
]

[project.optional-dependencies]
local_llm = [
    "llama-cpp-python>=0.2",
    "numpy>=1.24",
]
kb_extras = [
    "PyPDF2>=3.0",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "sentence-transformers>=2.2",
]
tokenizer = [
    "tiktoken>=0.7",
]
telegram = [
    "python-telegram-bot>=20.0",
]
discord = [
    "discord.py>=2.3",
]
dev = [
    "pytest>=7.0,<9",
    "pytest-mock>=3.10,<4",
    "pytest-benchmark>=4.0,<5",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "types-requests>=2.31",
]
all = [
    "riycol-agent[local_llm,kb_extras,tokenizer,telegram,discord,dev]",
]

[tool.setuptools.packages.find]
include = ["core*", "cli*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Fast isolated tests (no network, no I/O)",
    "integration: Tests spanning multiple components",
    "slow: Tests taking >1s (time.sleep, benchmarks)",
    "security: Security-related tests",
    "e2e: End-to-end pipeline tests",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disallow_any_unimported = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_generics = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
    "core.*",
    "cli.*",
    "plugins.*",
]
check_untyped_defs = true
