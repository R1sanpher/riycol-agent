<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 消耗监控 — Riycol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f23;color:#e0e0ff;min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
.header{background:linear-gradient(135deg,#1a1a3e,#0d0d2b);border-radius:12px;padding:16px 24px;margin-bottom:20px;border:1px solid #2a2a5e}
.header h1{font-size:18px;display:flex;align-items:center;gap:8px}
.header .sub{font-size:12px;opacity:0.6;margin-top:4px}
.header .actions{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.header .actions a{color:#7a7abe;text-decoration:none;font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid #2a2a5e}
.header .actions a:hover{background:#2a2a5e;color:#e0e0ff}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:#2a2a5e;color:#a0a0d0;margin-left:6px}
.badge.live{background:#2a5a2a;color:#80d080;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:#1a1a3e;border-radius:10px;padding:14px 16px;border:1px solid #2a2a5e}
.card .label{font-size:11px;color:#6a6a9e;margin-bottom:4px}
.card .value{font-size:22px;font-weight:600}
.card .value.green{color:#60d060}
.card .value.blue{color:#6090ff}
.card .value.purple{color:#b070ff}
.card .value.orange{color:#e8a040}
.card .value.pink{color:#f070b0}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:700px){.breakdown{grid-template-columns:1fr}}
.breakdown-box{background:#1a1a3e;border-radius:10px;padding:14px 16px;border:1px solid #2a2a5e}
.breakdown-box h3{font-size:13px;color:#a0a0d0;margin-bottom:10px}
.breakdown-box table{width:100%;font-size:12px;border-collapse:collapse}
.breakdown-box th{text-align:left;color:#6a6a9e;padding:4px 6px;border-bottom:1px solid #2a2a5e;font-weight:500}
.breakdown-box td{padding:4px 6px;border-bottom:1px solid #1f1f42}
.breakdown-box tr:last-child td{border-bottom:none}
.breakdown-box .num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{background:#1a1a3e;border-radius:10px;border:1px solid #2a2a5e;overflow:hidden}
.table-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #2a2a5e}
.table-header h3{font-size:13px;color:#a0a0d0}
.table-header .rec-controls{display:flex;gap:8px;align-items:center}
.table-header .rec-controls button{background:#2a2a5e;color:#a0a0d0;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px}
.table-header .rec-controls button:hover{background:#3a3a7e;color:#e0e0ff}
.table-header .rec-controls button.danger{color:#d06060}
.table-header .rec-controls button.danger:hover{background:#5a2a2a}
table.recent{width:100%;font-size:12px;border-collapse:collapse}
table.recent th{text-align:left;color:#6a6a9e;padding:8px 12px;border-bottom:1px solid #2a2a5e;font-weight:500;white-space:nowrap;position:sticky;top:0;background:#1a1a3e}
table.recent td{padding:6px 12px;border-bottom:1px solid #1f1f42;font-variant-numeric:tabular-nums}
table.recent tr:hover td{background:#222250}
table.recent .source-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px}
table.recent .source-tag.server{background:#2a3a5a;color:#7090d0}
table.recent .source-tag.agent{background:#3a2a5a;color:#b080e0}
table.recent .source-tag.telegram{background:#2a4a3a;color:#70c090}
table.recent .source-tag.planner{background:#4a3a2a;color:#d0a060}
table.recent .source-tag.reflection{background:#4a2a3a;color:#e080a0}
.empty-state{padding:40px;text-align:center;color:#4a4a7e;font-size:13px}
.scroll-wrap{max-height:500px;overflow-y:auto}
.footer{text-align:center;padding:20px;font-size:11px;color:#3a3a5e}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔢 Token 消耗监控 <span class="badge live" id="liveBadge">实时</span></h1>
    <div class="sub">实时显示每次 LLM 调用的 Token 消耗明细和累计统计</div>
    <div class="actions">
      <a href="/">← 返回聊天</a>
      <a href="/api/tokens" target="_blank">JSON 数据</a>
      <a href="/metrics" target="_blank">服务器指标</a>
    </div>
  </div>

  <div class="cards" id="totalCards">
    <div class="card"><div class="label">总调用次数</div><div class="value blue" id="totalCalls">-</div></div>
    <div class="card"><div class="label">Prompt Tokens</div><div class="value green" id="totalPrompt">-</div></div>
    <div class="card"><div class="label">Completion Tokens</div><div class="value purple" id="totalCompletion">-</div></div>
    <div class="card"><div class="label">总 Token 数</div><div class="value orange" id="totalTokens">-</div></div>
    <div class="card"><div class="label">估算费用 (USD)</div><div class="value pink" id="totalCost">-</div></div>
  </div>

  <div class="breakdown">
    <div class="breakdown-box">
      <h3>按来源</h3>
      <table><thead><tr><th>来源</th><th class="num">调用</th><th class="num">Prompt</th><th class="num">Completion</th></tr></thead>
      <tbody id="sourceBreakdown"></tbody></table>
    </div>
    <div class="breakdown-box">
      <h3>按模型</h3>
      <table><thead><tr><th>模型</th><th class="num">调用</th><th class="num">Prompt</th><th class="num">Completion</th><th class="num">费用</th></tr></thead>
      <tbody id="modelBreakdown"></tbody></table>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <h3>最近调用记录</h3>
      <div class="rec-controls">
        <span id="recCount" style="font-size:11px;color:#6a6a9e"></span>
        <button onclick="refresh()">🔄 刷新</button>
        <button class="danger" onclick="resetData()">🗑️ 重置</button>
      </div>
    </div>
    <div class="scroll-wrap">
      <table class="recent">
        <thead><tr>
          <th>时间</th><th>来源</th><th>模型</th><th class="num">Prompt</th><th class="num">Completion</th><th class="num">Total</th><th class="num">费用</th>
        </tr></thead>
        <tbody id="recentCalls"></tbody>
      </table>
      <div class="empty-state" id="emptyState">暂无调用记录</div>
    </div>
  </div>

  <div class="footer">Riycol Agent — Token Monitor · 自动刷新 3s</div>
</div>

<script>
function fmt(n) {
  if (n === undefined || n === null) return '-';
  return n.toLocaleString();
}

function fmtCost(n) {
  if (n === undefined || n === null || n === 0) return '$0.0000';
  if (n < 0.0001) return '$' + n.toFixed(6);
  if (n < 0.01) return '$' + n.toFixed(4);
  return '$' + n.toFixed(4);
}

function sourceClass(src) {
  var m = {server: 'server', agent: 'agent', telegram: 'telegram', planner: 'planner', reflection: 'reflection'};
  return m[src] || '';
}

async function refresh() {
  try {
    var resp = await fetch('/api/tokens');
    var d = await resp.json();

    // Totals
    var t = d.total;
    $('totalCalls').textContent = fmt(t.calls);
    $('totalPrompt').textContent = fmt(t.prompt_tokens);
    $('totalCompletion').textContent = fmt(t.completion_tokens);
    $('totalTokens').textContent = fmt(t.total_tokens);
    $('totalCost').textContent = fmtCost(t.cost);

    // Per-source breakdown
    var sb = '';
    for (var src in d.by_source) {
      var s = d.by_source[src];
      sb += '<tr><td><span class="source-tag ' + sourceClass(src) + '">' + src + '</span></td>'
         + '<td class="num">' + fmt(s.calls) + '</td>'
         + '<td class="num">' + fmt(s.prompt) + '</td>'
         + '<td class="num">' + fmt(s.completion) + '</td></tr>';
    }
    $('sourceBreakdown').innerHTML = sb || '<tr><td colspan="4" style="text-align:center;color:#4a4a7e;padding:12px">暂无数据</td></tr>';

    // Per-model breakdown
    var mb = '';
    for (var mdl in d.by_model) {
      var m = d.by_model[mdl];
      mb += '<tr><td>' + mdl + '</td>'
         + '<td class="num">' + fmt(m.calls) + '</td>'
         + '<td class="num">' + fmt(m.prompt) + '</td>'
         + '<td class="num">' + fmt(m.completion) + '</td>'
         + '<td class="num">' + fmtCost(m.cost) + '</td></tr>';
    }
    $('modelBreakdown').innerHTML = mb || '<tr><td colspan="5" style="text-align:center;color:#4a4a7e;padding:12px">暂无数据</td></tr>';

    // Recent calls
    var html = '';
    for (var i = 0; i < d.recent.length; i++) {
      var r = d.recent[i];
      html += '<tr>'
        + '<td style="white-space:nowrap">' + r.time_str + '</td>'
        + '<td><span class="source-tag ' + sourceClass(r.source) + '">' + r.source + '</span></td>'
        + '<td style="white-space:nowrap">' + r.model + '</td>'
        + '<td class="num">' + fmt(r.prompt_tokens) + '</td>'
        + '<td class="num">' + fmt(r.completion_tokens) + '</td>'
        + '<td class="num">' + fmt(r.total_tokens) + '</td>'
        + '<td class="num">' + fmtCost(r.cost) + '</td></tr>';
    }
    $('recentCalls').innerHTML = html;
    $('recCount').textContent = d.recent.length + ' / ' + fmt(t.calls) + ' 条';
    $('emptyState').style.display = d.recent.length ? 'none' : '';

    var ts = d.recent.length > 0 ? d.recent[0].time : null;
  } catch(e) {
    $('liveBadge').textContent = '断开';
    $('liveBadge').className = 'badge';
  }
}

function $(id) { return document.getElementById(id); }

async function resetData() {
  if (!confirm('确定要重置所有 Token 统计数据吗？')) return;
  try {
    await fetch('/api/tokens/reset', {method: 'POST'});
    refresh();
  } catch(e) {}
}

// Auto-refresh
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
